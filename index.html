<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日學習回報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #1d2630;
  --muted: #5d6b79;
  --line: #d7dde3;
  --en: #2c5f8d;
  --en-soft: #e3edf6;
  --jp: #b8512f;
  --jp-soft: #f7e6de;
  --ok: #2f7d52;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12181e;
    --surface: #1b232b;
    --fg: #e8edf1;
    --muted: #96a4b1;
    --line: #2f3b46;
    --en: #7db4e6;
    --en-soft: #1f3345;
    --jp: #f0916e;
    --jp-soft: #3d2a22;
    --ok: #6fcf97;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding: 24px 16px 40px;
}
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.5rem; margin: 0; line-height: 1.3; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.panel h2 {
  margin: 0;
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dot, var(--muted)); }
.p-en { --dot: var(--en); }
.p-en h2 { color: var(--en); }
.p-jp { --dot: var(--jp); }
.p-jp h2 { color: var(--jp); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label { font-size: 0.85rem; color: var(--muted); }
select, input[type="text"] {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
}
select:focus-visible, input:focus-visible, button:focus-visible {
  outline: 3px solid var(--en);
  outline-offset: 2px;
}
.rest {
  background: var(--en-soft);
  color: var(--fg);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.9rem;
}
.rest[hidden] { display: none; }
.report-card { border-color: var(--en); }
.report-card h2 { color: var(--fg); }
.report-card h2::before { background: var(--ok); }
pre.report {
  margin: 0;
  padding: 12px;
  background: var(--bg);
  border: 1px dashed var(--line);
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 1rem;
  white-space: pre-wrap;
  word-break: break-word;
}
.total {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--muted);
}
button.copy {
  min-height: 48px;
  font: inherit;
  font-weight: 700;
  color: #fff;
  background: var(--en);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}
@media (prefers-color-scheme: dark) { button.copy { color: #0d1620; } }
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); }
.hint.ok { color: var(--ok); }
</style>
</head>
<body>

<main>
  <header>
    <h1>每日學習回報</h1>
    <p class="sub">用選的就好。選完複製，貼回對話，我來幫你算進度與調整。</p>
  </header>

  <section class="panel">
    <div class="row">
      <div class="field">
        <label for="day">日期</label>
        <select id="day">
          <option>週一</option><option>週二</option><option>週三</option><option>週四</option>
          <option>週五</option><option>週六</option><option>週日</option>
        </select>
      </div>
      <div class="field">
        <label for="status">今天狀態</label>
        <select id="status">
          <option>很順</option>
          <option selected>還行</option>
          <option>有點累</option>
          <option>很沒動力</option>
          <option>休息日</option>
        </select>
      </div>
    </div>

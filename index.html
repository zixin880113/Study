<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日學習回報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <header>
    <h1>每日學習回報</h1>
    <p class="sub">用選的就好。選完複製，貼回對話，我來幫你算進度與調整。</p>
  </header>

  <section class="panel">
    <div class="row">
      <div class="field">
        <label for="day">日期</label>
        <select id="day">
          <option>週一</option><option>週二</option><option>週三</option><option>週四</option>
          <option>週五</option><option>週六</option><option>週日</option>
        </select>
      </div>
      <div class="field">
        <label for="status">今天狀態</label>
        <select id="status">
          <option>很順</option>
          <option selected>還行</option>
          <option>有點累</option>
          <option>很沒動力</option>
          <option>休息日</option>
        </select>
      </div>
    </div>
    <div id="restNote" class="rest" hidden>今天選了休息日，不計入進度，英文與日文欄位會先略過。</div>
  </section>

  <section class="panel p-en" id="enPanel">
    <h2>英文 多益</h2>
    <div class="row">
      <div class="field">
        <label for="enHours">時數</label>
        <select id="enHours"></select>
      </div>
      <div class="field">
        <label for="enTopic">內容</label>
        <select id="enTopic">
          <option>Part 5 文法</option>
          <option>Part 6 填空</option>
          <option>Part 7 閱讀</option>
          <option>錯題本複習</option>
          <option>整份模考</option>
          <option>單字</option>
          <option>聽力維持</option>
        </select>
      </div>
      <div class="field">
        <label for="enCount">做了幾題</label>
        <select id="enCount"></select>
      </div>
      <div class="field">
        <label for="enWrong">錯幾題</label>
        <select id="enWrong"></select>
      </div>
    </div>
  </section>

  <section class="panel p-jp" id="jpPanel">
    <h2>日文 N5</h2>
    <div class="row">
      <div class="field">
        <label for="jpHours">時數</label>
        <select id="jpHours"></select>
      </div>
      <div class="field">
        <label for="jpTopic">內容</label>
        <select id="jpTopic">
          <option>平假名複習</option>
          <option>片假名複習</option>
          <option>易混字 シ/ツ、ソ/ン</option>
          <option>單字</option>
          <option>助詞 は、が、を</option>
          <option>基礎句型</option>
          <option>N5 文法書</option>
          <option>聽日文</option>
        </select>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="field">
      <label for="note">補充（可不填）</label>
      <input id="note" type="text" placeholder="例如：Part 7 後半讀不完">
    </div>
  </section>

  <section class="panel report-card" aria-live="polite">
    <h2>要貼給 Claude 的回報</h2>
    <pre class="report" id="report"></pre>
    <div class="total" id="total"></div>
    <button class="copy" id="copyBtn" type="button">複製回報</button>
    <p class="hint" id="hint">選項一改，上面的文字會自動更新。</p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
